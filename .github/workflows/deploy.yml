name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: read

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  refresh-orbitvo:
    name: Refresh Orbitvo homepage
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Firefly Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"
            state="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "pending"' <<<"${response}")"

            case "${state}" in
              success)
                echo "Firefly Vercel deployment is ready."
                break
                ;;
              error|failure)
                echo "::error::Firefly Vercel deployment failed."
                exit 1
                ;;
              *)
                if [[ "${attempt}" -eq 60 ]]; then
                  echo "::error::Timed out waiting for the Firefly Vercel deployment."
                  exit 1
                fi
                sleep 10
                ;;
            esac
          done

      - name: Verify production RSS
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output /dev/null \
            "https://blog.orbitvo.com/rss.xml?deployment=${COMMIT_SHA}"

      - name: Trigger Orbitvo rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.ORBITVO_VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "${DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::ORBITVO_VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --output /dev/null \
            "${DEPLOY_HOOK_URL}"
